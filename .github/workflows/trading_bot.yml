name: Trading Signal Bot

# Questo file va caricato su GitHub nel percorso: .github/workflows/trading_bot.yml
# (vedi GUIDA.md per le istruzioni passo-passo)

on:
  schedule:
    - cron: '*/30 * * * *'   # fallback interno, di riserva se cron-job.org non parte
  workflow_dispatch: {}       # trigger primario, chiamato ogni minuto da cron-job.org

concurrency:
  group: trading-bot
  cancel-in-progress: false

permissions:
  contents: write   # necessario per salvare lo stato (state.json) nel repo

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # Senza un tetto, un run bloccato (es. una chiamata Kraken che non
    # risponde mai) resta appeso e occupa il concurrency group sopra per
    # ore: nessun run successivo puo' partire, quindi nessuno controlla
    # SL/TP/trailing sulle posizioni aperte per tutto quel tempo.
    timeout-minutes: 8
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Backup stato di partenza (per il merge a 3 vie)
        run: cp state.json state.base.json

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KRAKEN_API_KEY: ${{ secrets.KRAKEN_API_KEY }}
          KRAKEN_API_SECRET: ${{ secrets.KRAKEN_API_SECRET }}
        run: python bot.py

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then
            echo "Nessuna modifica a state.json"
            exit 0
          fi
          git commit -m "Aggiorna stato posizioni [skip ci]"

          # Primo tentativo: push diretto, funziona quando nessun altro
          # run ha scritto nel frattempo (il caso comune).
          if git push; then
            echo "Push riuscito (diretto)"
            exit 0
          fi

          echo "Push diretto fallito, merge a 3 vie su state.json..."
          cp state.json state.local.json

          for i in 1 2 3 4 5; do
            git fetch origin main
            git show origin/main:state.json > state.remote.json
            python3 merge_state.py state.base.json state.local.json state.remote.json state.json

            git reset --soft origin/main
            git add state.json
            git commit -m "Aggiorna stato posizioni (merge automatico) [skip ci]"

            if git push; then
              echo "Push riuscito dopo merge"
              exit 0
            fi
            echo "Push fallito dopo merge (tentativo $i), retry tra 3s..."
            sleep 3
          done
          echo "Push fallito dopo il merge automatico — le modifiche di questa run non sono state salvate"
          exit 1

      - name: Alert su fallimento salvataggio stato
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="⚠️ ATTENZIONE: il run del bot e' fallito (bot.py o salvataggio state.json). Controlla i log su GitHub Actions — potrebbe esserci una posizione non tracciata correttamente."
