name: Trading Signal Bot

# Questo file va caricato su GitHub nel percorso: .github/workflows/trading_bot.yml
# (vedi GUIDA.md per le istruzioni passo-passo)

on:
  schedule:
    - cron: '*/10 * * * *'   # fallback interno, di riserva se cron-job.org non parte
  workflow_dispatch: {}       # trigger primario, chiamato ogni minuto da cron-job.org

concurrency:
  group: trading-bot
  cancel-in-progress: false

permissions:
  contents: write   # necessario per salvare lo stato (state.json) nel repo

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KRAKEN_API_KEY: ${{ secrets.KRAKEN_API_KEY }}
          KRAKEN_API_SECRET: ${{ secrets.KRAKEN_API_SECRET }}
        run: python bot.py

      - name: Commit updated state
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then
            echo "Nessuna modifica a state.json"
            exit 0
          fi
          git commit -m "Aggiorna stato posizioni [skip ci]"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              echo "Push riuscito"
              exit 0
            fi
            echo "Push fallito (tentativo $i), retry tra 3s..."
            sleep 3
          done
          echo "Push fallito dopo 5 tentativi"
          exit 1

      - name: Alert su fallimento salvataggio stato
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="⚠️ ATTENZIONE: il run del bot e' fallito (bot.py o salvataggio state.json). Controlla i log su GitHub Actions — potrebbe esserci una posizione non tracciata correttamente."
